name: Multi Job CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests
        run: echo "Tests passed"

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Build application
        run: echo "This is the built application" > app.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: application-build
          path: app.txt

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: application-build

      - name: Show artifact
        run: cat app.txt

      - name: Deploy application
        run: echo "Deploy completed"

  config-check:
    runs-on: ubuntu-latest

    env:
      APP_ENV: staging
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}

    steps:
      - name: Show normal environment variable
        run: echo "Environment is $APP_ENV"

      - name: Check secret exists
        run: |
          if [ -n "$DEMO_TOKEN" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi
