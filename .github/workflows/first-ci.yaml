name: First CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: ls -la

      - name: Say hello
        run: echo "CI pipeline is running successfully"
      
      - name: Deliberate failure
        run: exit 1

      - name: Check Python
        run: python3 --version
