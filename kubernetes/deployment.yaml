apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
  
          env:
          - name: ENVIRONMENT
            valueFrom:
              configMapKeyRef:
                name: nginx-config
                key: environment

          - name: LOG_LEVEL
            valueFrom:
              configMapKeyRef:
                name: nginx-config
                key: log_level
